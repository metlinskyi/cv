name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/data.yaml'
      - 'src/template*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install wkhtmltopdf
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf

      - name: Generate CV files
        run: ./generate.sh

      - name: Commit generated files
        run: |
          git config user.name "GitHub[CI]"
          git config user.email "github@metlinskyi.com"
          git add index.html 'Roman Metlinskyi CV.pdf' README.md
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "Update generated CV files"
          git push origin HEAD:main
